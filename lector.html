<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-PQ2CHS8T');</script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Capitulo gratuito - Liora y Estela</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="reader-page">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PQ2CHS8T"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <main class="reader" aria-label="Lector de capitulos">
        <header class="reader-toolbar">
            <a href="./lanzamientos.html" class="reader-button" aria-label="Volver a lanzamientos">← <span>Volver</span></a>
            <h1 id="reader-title">Capitulo</h1>
            <div class="reader-status"><span id="page-number">1</span> / <span id="page-total">0</span></div>
        </header>

        <section class="page-stage">
            <button type="button" class="reader-nav previous-page" aria-label="Pagina anterior">‹</button>
            <img id="comic-page" src="" alt="Pagina del capitulo" draggable="false">
            <button type="button" class="reader-nav next-page" aria-label="Pagina siguiente">›</button>
            <p class="reader-message" hidden></p>
        </section>

        <footer class="reader-footer">
            <span>Desliza para pasar página</span>
            <div class="reader-progress" aria-hidden="true"><span id="progress-bar"></span></div>
        </footer>
    </main>

    <script>
        const chapters = {
            1: [
                'pagina_00.png', 'pagina_01.png', 'pagina_02.png', 'pagina_03.png',
                'pagina_04.png', 'pagina_05.png', 'pagina_06.png', 'pagina_07.png',
                'pagina_08.png', 'pagina_09.png', 'pagina_10.png', 'pagina_11.png',
                'pagina_12.png', 'pagina_13.png', 'pagina_14.png', 'pagina_15.png',
                'pagina_16.png', 'pagina_17.png', 'pagina_18.png', 'pagina_19.png'
            ],
            2: [
                'pagina_20.jpeg', 'pagina_21.jpeg', 'pagina_22.jpeg', 'pagina_23.jpeg',
                'pagina_24.jpeg', 'pagina_25.jpeg', 'pagina_26.jpeg', 'pagina_27.jpeg',
                'pagina_28.jpeg', 'pagina_29.jpeg', 'pagina_30.jpeg', 'pagina_31.jpeg',
                'pagina_32.jpeg', 'pagina_33.jpeg', 'pagina_34.jpeg', 'pagina_35.jpeg',
                'pagina_36.jpeg', 'pagina_37.png', 'pagina_38.jpeg', 'pagina_39.png',
                'pagina_40.png', 'pagina_41.png', 'pagina_42.png', 'pagina_43.png',
                'pagina_44.png', 'pagina_45.png', 'pagina_46.png', 'pagina_47.png',
                'pagina_48.png', 'pagina_49.png', 'pagina_50_1.jpeg', 'pagina_50_2.png',
                'pagina_51.png'
            ]
        };

        const chapterNumber = new URLSearchParams(window.location.search).get('capitulo');
        const pages = chapters[chapterNumber];
        const pageImage = document.querySelector('#comic-page');
        const title = document.querySelector('#reader-title');
        const pageNumber = document.querySelector('#page-number');
        const pageTotal = document.querySelector('#page-total');
        const progressBar = document.querySelector('#progress-bar');
        const message = document.querySelector('.reader-message');
        let currentPage = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let pinchStartDistance = 0;
        let zoomLevel = 1;
        let lastTapTime = 0;
        let isPinching = false;
        let touchStartScrollLeft = 0;
        let touchStartScrollTop = 0;

        function updateImageSize() {
            if (!pageImage.naturalWidth || !pageImage.naturalHeight) return;

            const stage = document.querySelector('.page-stage');
            const fitScale = Math.min(
                stage.clientWidth / pageImage.naturalWidth,
                stage.clientHeight / pageImage.naturalHeight
            );
            const imageWidth = pageImage.naturalWidth * fitScale * zoomLevel;
            const imageHeight = pageImage.naturalHeight * fitScale * zoomLevel;
            const horizontalMargin = Math.max(0, (stage.clientWidth - imageWidth) / 2);
            const verticalMargin = Math.max(0, (stage.clientHeight - imageHeight) / 2);

            pageImage.style.width = `${imageWidth}px`;
            pageImage.style.height = `${imageHeight}px`;
            pageImage.style.margin = `${verticalMargin}px ${horizontalMargin}px`;
        }

        function setZoom(level) {
            zoomLevel = Math.max(1, Math.min(level, 3));
            pageImage.classList.toggle('is-zoomed', zoomLevel > 1);
            updateImageSize();

            const stage = document.querySelector('.page-stage');
            requestAnimationFrame(() => {
                if (zoomLevel === 1) {
                    stage.scrollLeft = 0;
                    stage.scrollTop = 0;
                    return;
                }

                stage.scrollLeft = (stage.scrollWidth - stage.clientWidth) / 2;
                stage.scrollTop = (stage.scrollHeight - stage.clientHeight) / 2;
            });
        }

        function showPage(pageIndex) {
            currentPage = Math.max(0, Math.min(pageIndex, pages.length - 1));
            setZoom(1);
            pageImage.src = `./fotos/capitulo_0${chapterNumber}/${encodeURIComponent(pages[currentPage])}`;
            pageNumber.textContent = currentPage + 1;
            progressBar.style.width = `${((currentPage + 1) / pages.length) * 100}%`;
        }

        function changePage(amount) {
            showPage(currentPage + amount);
        }

        if (!pages) {
            title.textContent = 'Capitulo no encontrado';
            message.textContent = 'Vuelve a lanzamientos para elegir un capitulo.';
            message.hidden = false;
            pageImage.hidden = true;
            document.querySelectorAll('.reader-nav').forEach((button) => button.hidden = true);
        } else {
            title.textContent = `Capitulo ${chapterNumber}`;
            pageTotal.textContent = pages.length;
            showPage(0);
        }

        document.querySelector('.previous-page').addEventListener('click', () => changePage(-1));
        document.querySelector('.next-page').addEventListener('click', () => changePage(1));
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowLeft') changePage(-1);
            if (event.key === 'ArrowRight' || event.key === ' ') changePage(1);
        });
        pageImage.addEventListener('dblclick', () => setZoom(zoomLevel === 1 ? 2 : 1));
        pageImage.addEventListener('load', updateImageSize);
        window.addEventListener('resize', updateImageSize);
        pageImage.addEventListener('touchstart', (event) => {
            if (event.touches.length === 2) {
                isPinching = true;
                pinchStartDistance = Math.hypot(
                    event.touches[0].screenX - event.touches[1].screenX,
                    event.touches[0].screenY - event.touches[1].screenY
                );
                event.preventDefault();
                return;
            }

            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
            touchStartScrollLeft = document.querySelector('.page-stage').scrollLeft;
            touchStartScrollTop = document.querySelector('.page-stage').scrollTop;
            event.preventDefault();
        }, { passive: false });
        pageImage.addEventListener('touchmove', (event) => {
            if (event.touches.length === 1 && zoomLevel > 1 && !isPinching) {
                const stage = document.querySelector('.page-stage');
                stage.scrollLeft = touchStartScrollLeft - (event.touches[0].screenX - touchStartX);
                stage.scrollTop = touchStartScrollTop - (event.touches[0].screenY - touchStartY);
                event.preventDefault();
                return;
            }

            if (event.touches.length !== 2 || !pinchStartDistance) return;

            const distance = Math.hypot(
                event.touches[0].screenX - event.touches[1].screenX,
                event.touches[0].screenY - event.touches[1].screenY
            );
            setZoom(zoomLevel * (distance / pinchStartDistance));
            pinchStartDistance = distance;
            event.preventDefault();
        }, { passive: false });
        pageImage.addEventListener('touchend', (event) => {
            if (event.touches.length > 0) {
                pinchStartDistance = 0;
                return;
            }

            if (pinchStartDistance || isPinching) {
                pinchStartDistance = 0;
                isPinching = false;
                return;
            }

            const now = Date.now();
            if (now - lastTapTime < 300) {
                setZoom(zoomLevel === 1 ? 2 : 1);
                lastTapTime = 0;
                return;
            }
            lastTapTime = now;

            const distance = event.changedTouches[0].screenX - touchStartX;
            const verticalDistance = event.changedTouches[0].screenY - touchStartY;
            if (zoomLevel === 1 && Math.abs(distance) > 45 && Math.abs(distance) > Math.abs(verticalDistance)) {
                changePage(distance < 0 ? 1 : -1);
            }
        }, { passive: false });
    </script>
</body>
</html>
